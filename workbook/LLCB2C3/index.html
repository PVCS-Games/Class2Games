<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLCB2C3 — Chapter 3 Workbook</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#21314d;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dbe4f0;padding:20px max(20px,calc((100vw - 1050px)/2))}h1{font-size:clamp(23px,3vw,30px);margin:0 0 8px}header p{margin:0;color:#52657d}nav{display:flex;overflow:auto;gap:8px;margin:20px auto;max-width:1050px;padding:0 14px}button{cursor:pointer;background:#fff;border:1px solid #a8bfdf;color:#205695;border-radius:10px;padding:10px 13px;font:inherit}button.active,button.primary{background:#1766ba;color:#fff;border-color:#1766ba}button:disabled{opacity:.5}main{max-width:1050px;background:#fff;border:1px solid #dae3ed;border-radius:16px;padding:clamp(16px,3vw,28px);margin:0 auto 36px;min-height:480px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#61718a}.item{background:#f8faff;border:1px solid #dce7f5;border-radius:14px;padding:16px;margin:12px 0}.zh{font-family:KaiTi,"STKaiti","Kaiti SC",serif;font-size:clamp(27px,4vw,40px);line-height:1.6}.zh.sml{font-size:27px}.pinyin{color:#496c97;font-size:16px}.en{color:#586c85;font-size:15px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid #dbe4ef;border-radius:12px;padding:14px;text-align:center;min-width:0}.card img{max-height:130px;max-width:100%;object-fit:contain}.character{font-family:KaiTi,serif;font-size:110px;text-align:center;border:2px solid #a4c9ea;width:190px;height:190px;line-height:185px;margin:20px 0;background:linear-gradient(90deg,transparent 49.5%,#bfd8ed 50%,transparent 50.5%),linear-gradient(transparent 49.5%,#bfd8ed 50%,transparent 50.5%)}.answer{display:block;width:100%;margin:8px 0;text-align:left}.feedback{font-weight:600;margin:14px 0}.hint{font-size:13px;color:#697b91}.picture{max-height:150px;max-width:100%;object-fit:contain}.word{display:inline-block;margin:5px}.hide{display:none}@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}main{margin:0 10px 24px}}@media(max-width:420px){.cards{grid-template-columns:1fr}}

/* Chapter 3: one centered illustration per workbook exercise, text-only answer choices */
.fill-illustration{display:block;width:min(100%,580px);max-height:295px;object-fit:contain;margin:16px auto 20px;border-radius:12px;background:white}
.fill-line{font-family:KaiTi,"STKaiti",serif;font-size:clamp(22px,3.4vw,32px);line-height:2.1;margin:10px 0}
.fill-blank{font-family:inherit;color:#195aab;border:0;border-bottom:2px solid #2775c6;border-radius:0;padding:4px 12px;min-width:100px;background:#edf5ff;vertical-align:baseline}
.fill-blank.active{outline:2px solid #2775c6;outline-offset:2px;background:#dfefff}
.fill-options{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.fill-options button{min-width:95px;font-size:19px}
.fill-header{color:#395c80;font-weight:600;margin-top:14px}
</style></head><body><header><h1>LLC Book 2 · 第三课 去超级市场</h1><p>Going to the Supermarket · Chapter 3 Interactive Workbook</p></header><nav id="tabs"></nav><main id="view"></main><script>
let D=null;const tabs=["Lesson Dialogue 课文","Vocabulary 生字","Listen & Repeat 听一听","Sentence Unscramble 句子重组","Fill in the Blanks 选词填空","Reading Comprehension 阅读理解"];
let tab=0,py=true,en=true,slow=false,wordIndex=0,unsIndex=0,selected=[],rdSelections={},fillPicks={},activeFill={group:0,blank:0};const $=id=>document.getElementById(id);const E=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function speak(t){if(!('speechSynthesis' in window)){alert('Speech synthesis is unavailable in this browser');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=slow?.7:.95;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().includes('zh'))||null;speechSynthesis.speak(u)}
function controls(){return `<div class="row"><button class="${py?'active':''}" onclick="py=!py;render()">Pinyin</button><button class="${en?'active':''}" onclick="en=!en;render()">English</button><button class="${slow?'active':''}" onclick="slow=!slow;render()">Slow speed</button></div>`}
function tr(p){return (py&&p?`<div class="pinyin">${E(p)}</div>`:'')}
function english(s){return en&&s?`<div class="en">${E(s)}</div>`:''}
function render(){document.querySelector('#tabs').innerHTML=tabs.map((x,i)=>`<button class="${i===tab?'active':''}" onclick="tab=${i};render()">${x}</button>`).join('');let out='<h2>'+tabs[tab]+'</h2>'+controls();
if(tab===0){out+=`<div class="row"><button class="primary" onclick="playDialogue()">▶ Play All</button></div>`;D.dialogue.forEach((l,i)=>{out+=`<div class="item row"><div style="flex:0 0 82px;text-align:center">${l[4]?`<img class="picture" style="max-height:68px" src="${l[4]}">`:''}<strong>${E(l[0])}</strong></div><div style="flex:1;min-width:200px">${tr(l[3])}<div class="zh">${E(l[1])}</div>${english(l[2])}</div><button onclick="speak(D.dialogue[${i}][1])">▶</button></div>`})}
if(tab===1){out+=`<div class="row">${D.chars.map((a,i)=>`<button class="${wordIndex===i?'active':''}" onclick="wordIndex=${i};render()">${a[0]}</button>`).join('')}</div>`;let c=D.chars[wordIndex];out+=`<div class="character">${E(c[0])}</div>${tr(c[1])}${english(c[2])}<p>Radical: <b>${E(c[3])}</b> · Strokes: <b>${c[4]}</b></p><button onclick="speak(D.chars[wordIndex][0])">▶ Pronounce</button>`;if(c[5]?.length)out+=`<details><summary>Step-by-step 笔顺 (textbook)</summary><div class="row">${c[5].map(im=>`<img style="max-height:130px;max-width:200px" src="${im}">`).join('')}</div></details>`;out+=`<p class="hint">Stroke-order animation and handwriting canvas are available in the Chapter 1 master application; this standalone preview focuses on reviewing chapter content.</p><div class="row"><button onclick="wordIndex=Math.max(0,wordIndex-1);render()">Previous</button><button onclick="wordIndex=Math.min(D.chars.length-1,wordIndex+1);render()">Next</button></div>`}
if(tab===2){out+=`<div class="row"><button class="primary" onclick="playWords()">▶ Play All</button></div><div class="cards">`+D.words.map((w,i)=>`<div class="card">${w[3]?`<img src="${w[3]}">`:''}<div class="zh sml">${E(w[0])}</div>${tr(w[1])}${english(w[2])}<button onclick="speak(D.words[${i}][0])">▶ Listen</button></div>`).join('')+'</div>'}
if(tab===3){let q=D.uns[unsIndex],ord=q[0];out+=`<p class="muted">Tap the word blocks in the correct order to build a sentence.</p><div class="row">${D.uns.map((_,i)=>`<button class="${unsIndex===i?'active':''}" onclick="unsIndex=${i};selected=[];render()">${i+1}</button>`).join('')}</div><div class="item"><h3>Sentence ${unsIndex+1} / ${D.uns.length}</h3><div class="row">${ord.map((s,i)=>`<button ${selected.includes(i)?'disabled':''} onclick="selected.push(${i});render()">${E(s)} ♫</button>`).join('')}</div><hr><p>Your sentence:</p><div class="zh sml">${selected.map(i=>E(ord[i])).join(' ')||'＿＿＿＿＿＿＿＿'}</div><div class="row"><button onclick="speak(selected.map(i=>D.uns[unsIndex][0][i]).join(''))">▶ Read Sentence</button><button onclick="selected=[];render()">Reset</button><button class="primary" onclick="checkUns()">Check Answer</button></div><div id="result"></div></div>`}
if(tab===4){
 out+=`<p class="muted">Look at the picture, then select a blank and choose a word from the text-only answer choices. One central picture per exercise, as in Chapter 2.</p>`;
 (D.fillGroups||[]).forEach((g,gi)=>{
  let count=0;
  let lines=g.lines.map((parts,li)=>{
    let local=0;
    let segments=[E(parts[0])];
    let blanks=g.blanks.filter(b=>b.line===li);
    blanks.forEach((b,j)=>{let num=g.blanks.indexOf(b);let answer=fillPicks[gi+'-'+num];segments.push(`<button class="fill-blank ${activeFill.group===gi&&activeFill.blank===num?'active':''}" onclick="activeFill={group:${gi},blank:${num}};render()">${answer===undefined?'＿＿＿＿':E(answer)}</button>`);if(j===blanks.length-1)segments.push(E(parts[parts.length-1]||''))});
    return `<p class="fill-line">${segments.join('')}</p>`;
  }).join('');
  out+=`<section class="item"><h3>${E(g.title)}</h3>${g.picture?`<img class="fill-illustration" src="${g.picture}" alt="Original workbook shopping illustration">`:''}<div class="fill-header">Complete the sentences:</div>${lines}<div class="fill-header">Choose a word for the selected blank:</div><div class="fill-options">${g.options.map((w,j)=>`<button onclick="fillPicks[${gi}+'-'+(activeFill.group===${gi}?activeFill.blank:0)]=D.fillGroups[${gi}].options[${j}];activeFill.group=${gi};render()">${String.fromCharCode(65+j)}. ${E(w)}</button>`).join('')}</div><div class="row"><button onclick="resetFill(${gi})">Reset</button><button onclick="speak(D.fillGroups[${gi}].lines.map(p=>p.join('')).join(''))">▶ Listen</button><button class="primary" onclick="checkFill(${gi})">Check Answer</button><span class="feedback" id="fill-result-${gi}"></span></div></section>`;
 });
}
if(tab===5){let r=D.reading;out+=`<p class="muted">${E(r.instruction)}</p><button class="primary" onclick="playReading()">▶ Play All</button>`;r.passage.forEach((s,i)=>out+=`<div class="item row"><div style="flex:1">${tr(s[1])}<div class="zh sml">${E(s[0])}</div>${english(s[2])}</div><button onclick="speak(D.reading.passage[${i}][0])">▶</button></div>`);r.questions.forEach((q,i)=>{out+=`<div class="item"><h3>${i+1}. ${E(q.prompt[0])}</h3>${tr(q.prompt[1])}${english(q.prompt[2])}`;q.options.forEach((o,j)=>out+=`<button class="answer" onclick="rdSelections[${i}]=${j};document.querySelectorAll('.rd${i}').forEach(x=>x.classList.remove('active'));this.classList.add('active')" class="rd${i}">${String.fromCharCode(65+j)}. ${E(o[0])} ${en?`· ${E(o[2])}`:''}</button>`.replace('class="answer" onclick','class="answer rd'+i+'" onclick'));out+=`<button onclick="document.getElementById('r${i}').textContent=rdSelections[${i}]===undefined?'Select an answer.':D.reading.questions[${i}].answer.includes(rdSelections[${i}])?'✓ Correct!':'Try again.'">Check Answer</button><span id="r${i}" class="feedback"></span></div>`})}
$('view').innerHTML=out}
function resetFill(gi){let g=D.fillGroups[gi];g.blanks.forEach((_,j)=>delete fillPicks[gi+'-'+j]);activeFill={group:gi,blank:0};render()}
function checkFill(gi){let g=D.fillGroups[gi];let picked=g.blanks.map((b,j)=>fillPicks[gi+'-'+j]);let el=document.getElementById('fill-result-'+gi);el.textContent=picked.some(x=>x===undefined)?'Please complete all blanks.':picked.every((x,j)=>x===g.blanks[j].answer)?'✓ All correct!':'Some answers need another try.';}
function checkUns(){let q=D.uns[unsIndex],ok=selected.length===q[1].length&&selected.every((v,i)=>v===q[1][i]);$('result').textContent=ok?'✓ Correct!':'Try again.';$('result').className='feedback'}
function playSeq(arr){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let i=0;function next(){if(i>=arr.length)return;let u=new SpeechSynthesisUtterance(arr[i++]);u.lang='zh-CN';u.rate=slow?.7:.95;u.onend=next;speechSynthesis.speak(u)}next()}
function playDialogue(){playSeq(D.dialogue.map(x=>x[1]))}function playWords(){playSeq(D.words.map(x=>x[0]))}function playReading(){playSeq(D.reading.passage.map(x=>x[0]))}
async function loadLesson(){
  try {
    const response=await fetch('quiz-data.json',{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const lesson=await response.json();
    if(!lesson.meta || !Array.isArray(lesson.words) || !Array.isArray(lesson.fillGroups)) throw new Error('Invalid lesson data');
    D=lesson;
    document.title=D.meta.pageTitle || D.meta.title;
    render();
  } catch(err) {
    document.getElementById('view').innerHTML='<h2>Unable to load lesson</h2><p>Please open this workbook through GitHub Pages with quiz-data.json in the same directory.</p><p>'+E(err.message)+'</p>';
  }
}
loadLesson();
</script></body></html>
