<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Chinese Learning</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#23314a;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:white;padding:18px clamp(14px,3vw,32px);border-bottom:1px solid #d8e1f0}h1{font-size:clamp(22px,3vw,28px);margin:0 0 5px}.sub{color:#63748c;font-size:14px}.bar,.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}button,select{cursor:pointer;padding:10px 14px;border-radius:10px;font:inherit;font-weight:650;border:1px solid #b7c7de;background:white;color:#3154a0}button.active,button.primary{background:#305bc5;color:white;border-color:#305bc5}button:disabled{opacity:.45;cursor:default}.stage{max-width:1100px;margin:14px auto;padding:0 12px}.sheet{background:white;border:1px solid #dce3ee;border-radius:15px;padding:clamp(16px,3vw,32px)}h2{margin-top:0}.han{font-family:KaiTi,STKaiti,'Noto Serif CJK SC',serif;font-size:27px}ruby{ruby-position:over}rt{font:13px system-ui;color:#64748b}.py,.en{display:none}.showpy .py,.showen .en{display:block}.showpy rt{visibility:visible}rt{visibility:hidden}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.picturegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid #dce3ee;border-radius:14px;padding:16px;background:#fff;text-align:center}.card img{max-width:100%;object-fit:contain}.picturegrid img{width:145px;aspect-ratio:1}.character{font-size:110px;line-height:1.2;background:linear-gradient(90deg,transparent 49.6%,#d6dce5 50%,transparent 50.4%),linear-gradient(0deg,transparent 49.6%,#d6dce5 50%,transparent 50.4%);border:1px solid #bec8d5;width:150px;height:150px;display:grid;place-items:center;margin:auto}.stroke{width:100%;max-height:160px;object-fit:contain}.q{padding:20px 0;border-top:1px solid #e5eaf3}.line{display:flex;gap:12px;align-items:flex-start}.speaker{min-width:65px;color:#305bc5;font-weight:bold}.line .han{font-size:26px}.playing{background:#eef3ff;text-decoration:underline;text-underline-offset:7px}.answer{min-height:62px;border:1px dashed #aabbd0;border-radius:10px;padding:8px;margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.options{display:flex;gap:10px;flex-wrap:wrap}.options button{flex:1;min-width:110px}.options img{display:block;width:95px;height:95px;object-fit:contain;margin:auto}.good{color:#147544}.bad{color:#b42318}.feedback{font-weight:bold;margin-top:8px}.charpic{width:65px;vertical-align:middle}.note{font-size:13px;color:#63748c}.practice{display:none;margin:10px auto;touch-action:none;border:1px solid #aabbd0;max-width:100%;background:#fff}.practice.open{display:block}@media(max-width:650px){.grid{grid-template-columns:1fr}.picturegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.han{font-size:23px}.line{flex-wrap:wrap}.card{padding:12px}}

.vocab-card{border:1px solid #dce3ee;border-radius:18px;padding:clamp(18px,3vw,34px);background:white;min-height:65vh}.vocab-top,.vocab-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.vocab-top{color:#63748c;font-size:15px}.vocab-main{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,65px);align-items:center;margin:25px 0 30px}.vocab-face{text-align:center}.vocab-pinyin{font-size:30px;color:#52627b;margin-bottom:14px}.vocab-glyph{width:min(100%,310px);aspect-ratio:1;margin:auto;display:grid;place-items:center;border:1px solid #aebac9;background:linear-gradient(45deg,transparent 49.7%,#e0e5ed 50%,transparent 50.3%),linear-gradient(-45deg,transparent 49.7%,#e0e5ed 50%,transparent 50.3%),linear-gradient(90deg,transparent 49.7%,#d4dce6 50%,transparent 50.3%),linear-gradient(0deg,transparent 49.7%,#d4dce6 50%,transparent 50.3%);font-size:clamp(125px,20vw,230px);line-height:1;color:#202a38}.vocab-meaning{font-size:25px;font-weight:650;margin:14px 0 0}.vocab-info{display:grid;gap:18px}.vocab-label{font-size:14px;color:#63748c;margin-bottom:5px}.vocab-value{font-size:35px;font-weight:650}.vocab-examples{display:grid;gap:12px}.vocab-example{display:flex;align-items:center;gap:12px}.vocab-example .han{font-size:32px}.vocab-example small{display:block;color:#63748c;font-size:15px}.vocab-strokes{border-top:1px solid #dce3ee;padding-top:16px}.vocab-strokes h3{margin:0 0 14px}.vocab-diagrams{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;padding:12px 0}.vocab-diagrams img{max-width:100%;height:auto;max-height:180px;object-fit:contain;flex:0 1 auto}.vocab-bottom{border-top:1px solid #dce3ee;margin-top:22px;padding-top:18px}.vocab-index{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.vocab-index button{font-size:23px;min-width:52px;padding:7px 13px}.vocab-card .practice{width:300px;height:auto}.vocab-card .practice.open{display:block}.vocab-card button:focus-visible{outline:3px solid #819de9;outline-offset:3px}@media(max-width:650px){.vocab-main{grid-template-columns:1fr;gap:20px}.vocab-info{grid-template-columns:1fr 1fr}.vocab-examples{grid-column:1/-1}.vocab-glyph{width:min(100%,240px);font-size:170px}.vocab-diagrams img{max-height:130px}.vocab-bottom button{flex:1}}
.stroke-player{text-align:center;margin:16px 0}.stroke-player img{display:block;width:250px;height:250px;object-fit:contain;margin:0 auto 10px;border:1px solid #dce3ee;background:#fff;border-radius:8px;image-rendering:auto}.stroke-player #strokeProgress{font-weight:700;color:#3154a0}details summary{cursor:pointer;color:#3154a0;margin:10px 0}#audioStatus{font-size:13px;color:#52627b;min-height:1em}.stroke-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:12px 0}.stroke-tile{padding:4px;background:white;border:1px solid #dce3ee;border-radius:6px;display:grid;gap:4px;justify-items:center;color:#3154a0}.stroke-tile img{width:100%;max-width:150px;aspect-ratio:1;object-fit:contain}.stroke-player img{width:min(100%,340px);height:auto;aspect-ratio:1}.dialogue-speaker{flex:0 0 82px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}.dialogue-speaker img{width:72px;height:72px;object-fit:contain}.dialogue-speaker .speaker{min-width:0;font-size:21px}.line>div:nth-child(2){min-width:0}@media(max-width:650px){.line{flex-wrap:nowrap}.dialogue-speaker{flex-basis:54px}.dialogue-speaker img{width:50px;height:50px}.dialogue-speaker .speaker{font-size:17px}.line>button{padding:7px}}
.diary{background:#f0faf5;border:1px solid #b8dfcf;border-radius:14px;padding:20px;margin:16px 0}.diary-date{text-align:right;margin-bottom:12px}.diary-line{line-height:2.1;margin:6px 0;display:flex;gap:10px;align-items:center}.diary-line>div{flex:1}.reading-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.reading-options button{text-align:left;min-width:0}.reading-options .han{font-size:24px}.reading-options .en{font-size:14px}.reading-q .en{margin:5px 0}.reading-q .bar{gap:8px}@media(max-width:500px){.reading-options .han{font-size:20px}.reading-options button{padding:7px}.diary{padding:12px}}

.language-toggle{min-width:142px;min-height:46px;padding:10px 16px;border:2px solid #305bc5;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:750;background:#fff;color:#24479a}.language-toggle[aria-pressed="true"]{background:#305bc5;color:#fff;border-color:#305bc5}.language-toggle:focus-visible{outline:3px solid #8aaaff;outline-offset:3px}

.line[id^="line"] > div:nth-child(2) .han{font-size:clamp(29px,4.2vw,40px);line-height:1.7;overflow-wrap:anywhere}
.picturegrid .card > .han{font-size:clamp(29px,4.5vw,42px);line-height:1.35;overflow-wrap:anywhere}
</style></head><body><header><h1 id="lessonTitle">Interactive Chinese Learning</h1><div class="sub" id="lessonSubtitle"></div><div class="bar"><button type="button" class="language-toggle" id="py" aria-pressed="false">Pinyin</button><button type="button" class="language-toggle" id="en" aria-pressed="false">English</button><label>Audio speed <select id="speed"><option value="1">Normal</option><option value="0.7">Slow</option></select></label><button onclick="pauseAudio()" id="pause">Pause / Resume</button><button onclick="stopAudio()">Stop</button></div><nav class="nav" id="nav"></nav><div id="audioStatus" role="status"></div></header><main class="stage"><section class="sheet" id="sheet"></section><p class="note">Preview only · scores stay on this page · no Google Form submission. Audio uses your browser’s Mandarin voice.</p></main><script>
let D;const $=id=>document.getElementById(id), tabs=['1 · Lesson Dialogue','2 · Vocabulary','3 · Listen & Repeat','4 · Sentence Unscramble','5 · Fill in the Blanks','6 · Reading Comprehension'];let readingPicks=[];let vocabIndex=0;let current=0,seq=[],picks=[],checked={},token=0;const h=s=>`<span class="han">${s}</span>`;const btn=(t,fn,cls='')=>`<button class="${cls}" onclick="${fn.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}">${t}</button>`;

function ruby(s,p){let a=p.replace(/[,.。]/g,'').split(/\s+/),i=0;return '<span class="han">'+Array.from(s).map(c=>/[\u3400-\u9fff]/.test(c)?`<ruby>${c}<rt>${a[i++]||''}</rt></ruby>`:c).join('')+'</span>'}

let strokeTimer=null,strokeStep=0, utterance=null, speechQueue=[], speechIndex=0, paused=false, watchdog=null;
const synth=window.speechSynthesis;
function audioStatus(s){const e=$('audioStatus');if(e)e.textContent=s;}
function clearHighlight(){document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));}
function stopAudio(){token++;clearTimeout(watchdog);speechQueue=[];speechIndex=0;paused=false;utterance=null;if(synth){synth.cancel();synth.resume();}clearHighlight();audioStatus('');}
function pauseAudio(){if(!synth||!speechQueue.length)return;if(paused){paused=false;synth.resume();audioStatus('Playing…');}else{paused=true;synth.pause();audioStatus('Paused.');}}
function mandarinVoice(){const v=synth.getVoices();return v.find(x=>/^zh[-_]CN$/i.test(x.lang))||v.find(x=>/^zh[-_](TW|SG)$/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang));}
if(synth){synth.getVoices();synth.addEventListener('voiceschanged',()=>synth.getVoices());}
function speakList(items){stopAudio();if(!synth){audioStatus('Speech is unavailable. Open this HTML in Chrome or Edge.');return;}speechQueue=items;const run=token;
function next(){if(run!==token)return;clearTimeout(watchdog);clearHighlight();if(speechIndex>=speechQueue.length){speechQueue=[];utterance=null;audioStatus('Playback finished.');return;}const [text,id]=speechQueue[speechIndex++];const el=$(id);if(el)el.classList.add('playing');const u=new SpeechSynthesisUtterance(text);utterance=u;u.lang='zh-CN';u.rate=Number($('speed').value);const voice=mandarinVoice();if(voice)u.voice=voice;u.onstart=()=>{if(run===token)audioStatus('Playing…');};u.onend=()=>{if(run===token){utterance=null;next();}};u.onerror=e=>{if(run!==token)return;clearTimeout(watchdog);clearHighlight();speechQueue=[];utterance=null;audioStatus('Audio error: '+e.error+'. Check your Mandarin voice in browser/system settings and try again.');};audioStatus('Starting audio…');synth.speak(u);watchdog=setTimeout(()=>{if(run===token&&utterance===u&&!synth.speaking&&!paused){stopAudio();audioStatus('Audio did not start. Open in Chrome or Edge and check that a Mandarin voice is installed.');}},4500);}
next();}
// Stroke shapes: Hanzi Writer Data / Make Me a Hanzi / Arphic Public License.
const vectorData={}, vectorPending={};
function strokeSVG(data,n,small=false){
 const paths=data.strokes.map((p,j)=>`<path d="${p}" fill="${j<n?'#151515':j===n?'#e63232':'#d8d8d8'}"/>`).join('');
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img"><rect x="5" y="5" width="1014" height="1014" fill="white" stroke="#a6d7fc" stroke-width="8"/><path d="M512 5V1019M5 512H1019M5 5L1019 1019M1019 5L5 1019" fill="none" stroke="#c2e3f9" stroke-width="4" stroke-dasharray="12 10"/><g transform="translate(82 840) scale(.84 -.84)">${paths}</g></svg>`;
}
function strokeURI(data,n){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(strokeSVG(data,n));}
function loadStrokeData(i){
 if(vectorData[i])return Promise.resolve(vectorData[i]);
 if(vectorPending[i])return vectorPending[i];
 const ch=D.chars[i][0];
 const urls=['https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/'+encodeURIComponent(ch)+'.json','https://raw.githubusercontent.com/chanind/hanzi-writer-data/master/data/'+encodeURIComponent(ch)+'.json'];
 vectorPending[i]=(async()=>{for(const url of urls){try{const r=await fetch(url);if(!r.ok)continue;const d=await r.json();if(d.strokes?.length!==D.chars[i][4])continue;vectorData[i]=d;return d;}catch(e){}}return null;})();
 return vectorPending[i];
}
function initVector(i){
 $('strokeProgress').textContent='Loading…';
 loadStrokeData(i).then(d=>{if(current!==1||vocabIndex!==i||!$('strokeFrame'))return;
 if(!d){$('strokeProgress').textContent='Unable to load stroke order. Check your internet connection and reopen this card.';return;}
 displayStroke(i,strokeStep);
 });
}
function stopStroke(){clearTimeout(strokeTimer);strokeTimer=null}
function displayStroke(i,n){let e=$('strokeFrame');if(!e||current!==1||vocabIndex!==i)return;if(!vectorData[i])return;strokeStep=n;e.src=strokeURI(vectorData[i],n);$('strokeProgress').textContent='Stroke '+(n+1)+' / '+D.chars[i][4];}
function animateStroke(i){if(!vectorData[i])return;stopStroke();let n=0;function step(){if(current!==1||vocabIndex!==i)return;displayStroke(i,n);n++;if(n<D.chars[i][4])strokeTimer=setTimeout(step,Number($('strokeSpeed').value));else strokeTimer=null}step()}
function stepStroke(i,delta){stopStroke();displayStroke(i,Math.max(0,Math.min(D.chars[i][4]-1,strokeStep+delta)))}
function say(s){speakList([[s,'']])}function show(i){stopStroke();stopAudio();current=i;render();window.scrollTo(0,0)}function render(){ $('nav').innerHTML=tabs.map((t,i)=>i===5&&!D.reading?'':btn(t,`show(${i})`,i===current?'active':'')).join('');let s='';if(current===0){s='<h2>Lesson Dialogue · 课文</h2><p>Listen to the dialogue, then read aloud.</p>'+btn('▶ Play All','speakList(D.dialogue.map((d,i)=>[d[1],"line"+i]))','primary');D.dialogue.forEach((d,i)=>{s+=`<div class="q line" id="line${i}"><div class="dialogue-speaker"><img src="${d[4]}" alt="${d[0]}"><span class="speaker han">${d[0]}</span></div><div style="flex:1">${ruby(d[1],d[3])}<div class="en">${d[2]}</div></div>${btn('🔊',`speakList([[D.dialogue[${i}][1],"line${i}"]])`)}</div>`})}
if(current===1){let i=vocabIndex,c=D.chars[i];s=`<h2>Vocabulary · 生字</h2><div class="vocab-index" aria-label="Choose character">${D.chars.map((v,j)=>btn(v[0],`goVocab(${j})`,'han '+(j===i?'active':''))).join('')}</div><article class="vocab-card"><div class="vocab-top"><strong>Character ${i+1} of ${D.chars.length}</strong>${btn('🔊 Listen',`say(D.chars[${i}][0])`)}</div><div class="vocab-main"><div class="vocab-face"><div class="vocab-pinyin">${c[1]}</div><div class="vocab-glyph han">${c[0]}</div><div class="vocab-meaning">${c[2].charAt(0).toUpperCase()+c[2].slice(1)}</div></div><div class="vocab-info"><div><div class="vocab-label">Radical 部首</div><div class="vocab-value han">${c[3]}</div></div><div><div class="vocab-label">Stroke count 笔画</div><div class="vocab-value">${c[4]}</div></div><div class="vocab-examples"><div class="vocab-label">Example words</div>${c[6].map((e,j)=>`<div class="vocab-example"><div><span class="han">${e[0]}</span><small>${e[1]}</small></div>${btn('🔊',`say(D.chars[${i}][6][${j}][0])`)}</div>`).join('')}</div></div></div><div class="vocab-strokes"><h3>Stroke Order 笔顺</h3><div class="stroke-player"><img id="strokeFrame" src="${vectorData[i]?strokeURI(vectorData[i],0):'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22/%3E'}" alt="Animated stroke order for ${c[0]}"><div id="strokeProgress" aria-live="polite">Stroke 1 / ${c[4]}</div><div class="bar" style="justify-content:center">${btn('▶ Animate',`animateStroke(${i})`,'primary')}${btn('↻ Replay',`animateStroke(${i})`)}${btn('Pause',`stopStroke()`)}${btn('← Stroke',`stepStroke(${i},-1)`)}${btn('Stroke →',`stepStroke(${i},1)`)}<label>Speed <select id="strokeSpeed"><option value="700">Normal</option><option value="1250">Slow</option></select></label></div></div><details><summary>Step-by-step 笔顺</summary><div class="vocab-diagrams">${c[5].map((a,j)=>`<img src="${a}" alt="${c[0]} stroke order diagram ${j+1}">`).join('')}</div></details><div class="bar" style="justify-content:center">${btn('Practice Writing',`practice(${i})`,'primary')}${btn('Clear',`clearCanvas(${i})`)}</div><canvas class="practice" id="canvas${i}" width="240" height="240"></canvas></div><div class="vocab-bottom"><button onclick="goVocab(${i-1})" ${i===0?'disabled':''}>← Previous</button><span class="note">${i+1} / ${D.chars.length}</span><button class="primary" onclick="goVocab(${i+1})" ${i===D.chars.length-1?'disabled':''}>Next →</button></div></article>`}
if(current===2){s='<h2>Listen and Repeat · 听一听</h2><p>Click a picture to listen. Repeat the word aloud.</p>'+btn('▶ Play All','speakList(D.words.map((w,i)=>[w[0],"word"+i]))','primary')+'<div class="grid picturegrid" style="margin-top:15px">';D.words.forEach((w,i)=>{s+=`<button class="card" id="word${i}" onclick="speakList([[D.words[${i}][0],'word${i}']])"><img src="${w[3]}" alt="${w[0]}"><div class="han">${w[0]}</div><div class="py">${w[1]}</div><div class="en">${w[2]}</div>🔊</button>`});s+='</div>'}
if(current===3){s='<h2>Sentence Unscramble · 句子重组</h2><p>Click the words in the correct order. Click an answer word to remove it. Use Listen to hear the word bank, and Read Sentence to hear your arrangement.</p>';D.uns.forEach(([w,k],i)=>{let a=seq[i];s+=`<div class="q"><strong>Question ${i+1}</strong> ${btn('🔊 Listen',`listenU(${i})`)}<div class="bar">${w.map((x,j)=>`<button class="han" ${a.includes(j)?'disabled':''} onclick="add(${i},${j})">${x}</button>`).join('')}</div><div class="answer">${a.length?a.map(j=>btn(w[j],`remove(${i},${j})`,'han')).join(''):'<span class="note">Your sentence goes here...</span>'}</div>${btn('Check Answer',`checkU(${i})`,'primary')} ${btn('Reset',`resetU(${i})`)} ${btn('🔊 Read Sentence',`readU(${i})`)} <span id="fu${i}" class="feedback">${checked['u'+i]||''}</span></div>`});s+='<p id="scoreU"></p>'}
if(current===4){s='<h2>Fill in the Blanks · 选词填空</h2><p>Look at the pictures and choose the correct answer. Then read the sentence aloud.</p>';D.qs.forEach((q,i)=>{const section=D.fillSections.find(x=>x.start===i);if(section)s+=`<h3>${section.title}</h3>`;s+=`<div class="q"><div><img class="charpic" src="${q[5]}"> <strong>${i-(D.fillSections.filter(x=>x.start<=i).at(-1)?.start??0)+1}.</strong> ${h(q[0]+(picks[i]<0?'＿＿＿＿':q[2][picks[i]])+q[1])}</div><div class="options">${q[2].map((w,j)=>`<button class="${picks[i]===j?'active':''}" onclick="pick(${i},${j})"><img src="${q[4][j]}" alt="${w}">${String.fromCharCode(65+j)}. ${h(w)}</button>`).join('')}</div><div class="bar">${btn('Check Answer',`checkF(${i})`,'primary')}${btn('🔊 Read Sentence',`readF(${i})`)}<span class="feedback">${checked['f'+i]||''}</span></div></div>`});s+='<p id="scoreF"></p>'}if(current===5&&D.reading)s=renderReading();$('sheet').innerHTML=s;score();if($('scoreR'))$('scoreR').textContent='Correct: '+D.reading.questions.filter((q,i)=>checked['r'+i]?.includes('good')).length+' / '+D.reading.questions.length;if(current===1)initVector(vocabIndex)}
function readingRow(r){return ruby(r[0],r[1])+`<div class="en">${r[2]}</div>`}
function renderReading(){const r=D.reading;let s=`<h2>${r.title}</h2><p>${r.instruction}</p>${btn('▶ Play All','playReading()','primary')}<article class="diary"><div class="diary-date">${readingRow(r.date)} ${readingRow(r.weather)} ☀️</div>`;r.passage.forEach((line,i)=>{s+=`<div class="diary-line" id="diary${i}"><div>${readingRow(line)}</div>${btn('🔊',`speakList([[D.reading.passage[${i}][0],"diary${i}"]])`)}</div>`});s+='</article>';r.questions.forEach((q,i)=>{s+=`<div class="q reading-q"><strong>${i+1}.</strong> ${readingRow(q.prompt)} ${btn('🔊 Listen',`listenReading(${i})`)}${q.answer.length>1?'<p class="note">There are two correct answers. Select both.</p>':''}<div class="reading-options">${q.options.map((o,j)=>`<button aria-pressed="${readingPicks[i].includes(j)}" class="${readingPicks[i].includes(j)?'active':''}" onclick="pickReading(${i},${j})">${String.fromCharCode(65+j)}. ${readingRow(o)}</button>`).join('')}</div><div class="bar">${btn('Check Answer',`checkReading(${i})`,'primary')}${btn('Reset',`resetReading(${i})`)}<span class="feedback">${checked['r'+i]||''}</span></div></div>`});return s+'<p id="scoreR"></p>'}
function playReading(){speakList([[D.reading.date[0],''],[D.reading.weather[0],''],...D.reading.passage.map((r,i)=>[r[0],'diary'+i])])}
function listenReading(i){const q=D.reading.questions[i];speakList([[q.prompt[0],''],...q.options.map(o=>[o[0],''])])}
function pickReading(i,j){const a=readingPicks[i],multi=D.reading.questions[i].answer.length>1;readingPicks[i]=a.includes(j)?a.filter(x=>x!==j):multi?[...a,j]:[j];delete checked['r'+i];render()}
function resetReading(i){readingPicks[i]=[];delete checked['r'+i];render()}
function checkReading(i){const q=D.reading.questions[i],a=readingPicks[i];checked['r'+i]=a.length===q.answer.length&&q.answer.every(j=>a.includes(j))?'<span class="good">Correct!</span>':'<span class="bad">Try again.</span>';render()}

function goVocab(i){if(i<0||i>=D.chars.length)return;stopStroke();strokeStep=0;stopAudio();vocabIndex=i;render();window.scrollTo(0,0)}document.addEventListener('keydown',e=>{if(current!==1||e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();goVocab(vocabIndex+(e.key==='ArrowRight'?1:-1))}});function add(i,j){seq[i].push(j);delete checked['u'+i];render()}function remove(i,j){seq[i]=seq[i].filter(x=>x!==j);delete checked['u'+i];render()}function resetU(i){seq[i]=[];delete checked['u'+i];render()}function listenU(i){speakList(D.uns[i][0].map(w=>[w,'']))}function readU(i){if(seq[i].length!==D.uns[i][0].length){audioStatus('Arrange all words before reading the sentence.');return;}say(seq[i].map(j=>D.uns[i][0][j]).join('')+'。')}function checkU(i){checked['u'+i]=seq[i].join()===D.uns[i][1].join()?'<span class="good">Correct!</span>':'<span class="bad">Try again.</span>';render()}function pick(i,j){picks[i]=j;delete checked['f'+i];render()}function checkF(i){checked['f'+i]=picks[i]===D.qs[i][3]?'<span class="good">Correct!</span>':'<span class="bad">Try again.</span>';render()}function readF(i){let q=D.qs[i];if(picks[i]>=0)say(q[0]+q[2][picks[i]]+q[1])}function score(){if($('scoreU'))$('scoreU').textContent='Correct: '+D.uns.filter((q,i)=>checked['u'+i]?.includes('good')).length+' / '+D.uns.length;if($('scoreF'))$('scoreF').textContent='Correct: '+D.qs.filter((q,i)=>checked['f'+i]?.includes('good')).length+' / '+D.qs.length}
function practice(i){let c=$('canvas'+i);c.classList.toggle('open');if(c.dataset.ready)return;c.dataset.ready='1';let ctx=c.getContext('2d'),down=false;function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*240/r.width,(e.clientY-r.top)*240/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(!down)return;ctx.lineWidth=8;ctx.lineCap='round';ctx.lineTo(...pos(e));ctx.stroke()};c.onpointerup=c.onpointercancel=()=>down=false;clearCanvas(i)}function clearCanvas(i){let c=$('canvas'+i),x=c.getContext('2d');x.clearRect(0,0,240,240);x.strokeStyle='#d5dce5';x.lineWidth=1;x.beginPath();x.moveTo(120,0);x.lineTo(120,240);x.moveTo(0,120);x.lineTo(240,120);x.moveTo(0,0);x.lineTo(240,240);x.moveTo(240,0);x.lineTo(0,240);x.stroke();x.strokeStyle='#222'}
$('speed').onchange=()=>{if(speechQueue.length)audioStatus('New speed applies to the next item.');};[['py','showpy'],['en','showen']].forEach(([id,cls])=>{const b=$(id);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));document.body.classList.toggle(cls,on);});});
function startLesson(data){
 if(!data?.meta || !['dialogue','chars','words','uns','qs','fillSections'].every(k=>Array.isArray(data[k])) || !data.chars.length)throw new Error('Invalid lesson JSON.');
 D=data;current=0;vocabIndex=0;seq=D.uns.map(()=>[]);picks=D.qs.map(()=>-1);readingPicks=(D.reading?.questions||[]).map(()=>[]);checked={};
 document.title=D.meta.pageTitle||D.meta.title;$('lessonTitle').textContent=D.meta.title;$('lessonSubtitle').textContent=D.meta.subtitle||'';render();
}
async function loadLesson(){
 try{const r=await fetch('quiz-data.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);startLesson(await r.json());}
 catch(e){$('sheet').innerHTML='<h2>Load lesson data</h2><p>Choose quiz-data.json to open this lesson locally, or host both files in the same folder.</p><input type="file" id="lessonFile" accept=".json,application/json"><p id="loadError" role="alert"></p>';$('lessonFile').onchange=async ev=>{try{startLesson(JSON.parse(await ev.target.files[0].text()));}catch(err){$('loadError').textContent=err.message;}};}
}
loadLesson();</script></body></html>
